version: "2"

run:
  go: "1.26"
  tests: true
  timeout: 5m

linters:
  default: none
  enable:
    # === Core error detection ===
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # === Context, HTTP, errors, nil ===
    - bodyclose
    - contextcheck
    - errorlint
    - exhaustive
    - fatcontext
    - forcetypeassert
    - nilnil
    - nilerr
    - noctx
    - errname

    # === Security & Dependencies ===
    - gosec
    - depguard
    - asciicheck
    - bidichk

    # === Performance & modern Go ===
    - gocritic
    - dupl
    # - prealloc  # Disabled to reduce noise unless strict performance is required
    - perfsprint
    - modernize
    - usestdlibvars
    - usetesting
    - copyloopvar
    - intrange
    - durationcheck
    - makezero
    - exptostd

    # === Code quality & style ===
    - revive
    - unconvert
    - unparam
    - goconst
    - misspell
    - nakedret
    - predeclared
    - whitespace
    - gocyclo
    - wastedassign
    - nolintlint
    - musttag

    # === SQL ===
    - rowserrcheck
    - sqlclosecheck

    # === Test & Logging (Prod essentials) ===
    - tparallel
    - loggercheck
    - sloglint
    - testifylint

  settings:
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
        # - opinionated
        # - experimental
      disabled-checks:
        - hugeParam

    govet:
      enable:
        - shadow
        - nilness
      disable:
        - fieldalignment

    errcheck:
      check-type-assertions: false
      check-blank: true

    revive:
      enable-all-rules: false
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    gocyclo:
      min-complexity: 20  # Bumped from 15 to prevent over-refactoring of readable functions

    goconst:
      min-len: 5         # Bumped from 3 to reduce noise on short common strings
      min-occurrences: 4 # Bumped from 3 to reduce noise on short common strings
      ignore-tests: true

    misspell:
      locale: US

    nakedret:
      max-func-lines: 30

    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

    dupl:
      threshold: 120

    perfsprint:
      int-conversion: true
      err-error: true
      errorf: true
      sprintf1: true
      strconcat: true

    depguard:
      rules:
        main:
          deny:
            # 1. Standardization
            - pkg: "github.com/pkg/errors"
              desc: "Use standard library 'errors' and 'fmt.Errorf' with %w"
            - pkg: "io/ioutil"
              desc: "Deprecated in Go 1.16. Use 'io' or 'os' instead"
            # 2. Modern Go Features
            - pkg: "math/rand$"
              desc: "Use 'math/rand/v2' for better performance and security"
            - pkg: "log$"
              desc: "Prefer structured logging with 'log/slog'"
            # 3. Critical for Large Prod Projects (Security & Maintenance)
            - pkg: "github.com/satori/go.uuid"
              desc: "Unmaintained. Use 'github.com/google/uuid' instead"
            - pkg: "github.com/dgrijalva/jwt-go"
              desc: "Has known CVEs. Use 'github.com/golang-jwt/jwt/v5'"
            - pkg: "github.com/golang/protobuf"
              desc: "Use the new 'google.golang.org/protobuf' API"

    loggercheck:
      kitlog: false
      klog: false
      logr: false
      slog: true
      zap: true

  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - dupl
          - nilnil
          - goconst
          - gocyclo
          - errcheck
          - unparam
          # prealloc removed as it is globally disabled

      - path: _test\.go
        text: '^shadow: declaration of "err"'
        linters:
          - govet

      - path: cli/completion\.go
        text: "G101"
        linters:
          - gosec

      - path: cli/harness_smoke_test\.go
        text: "G204"
        linters:
          - gosec

      - path: cli/require\.go
        text: "G204"
        linters:
          - gosec

      - path: cli/selfbuild\.go
        text: "G204"
        linters:
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra:
        group-params: true
    goimports:
      local-prefixes:
        - github.com/nexssp/flow
